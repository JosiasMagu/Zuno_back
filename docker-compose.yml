# A password da base é obrigatória: sem POSTGRES_PASSWORD no .env o compose
# recusa arrancar. Evitar nela caracteres com significado num URL (@ : / ?).
x-database-url: &database-url postgresql://${POSTGRES_USER:-zuno}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-zuno_db}?schema=public

services:
  # Sem `ports`: a base só responde dentro da rede do compose. Para lhe chegar
  # da máquina: docker compose exec postgres psql -U zuno zuno_db
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zuno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-zuno_db}
    volumes:
      - zuno_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: *database-url
    restart: "no"

  api:
    build:
      context: .
      target: runner
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # As variáveis da aplicação vêm todas do .env, para uma variável nova não
    # ficar esquecida aqui. As três de baixo são as que o compose decide.
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: *database-url
    ports:
      - "${API_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  zuno_pg_data:
