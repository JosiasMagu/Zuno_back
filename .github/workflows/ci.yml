name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs antigos do mesmo PR/branch quando há push novo —
# evita filas e desperdício de minutos quando há vários commits seguidos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zuno_ci
          POSTGRES_PASSWORD: zuno_ci_password
          POSTGRES_DB: zuno_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zuno_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Variáveis que o backend exige no arranque via getOrThrow.
      # Valores fictícios — servem só para o CI conseguir bootstrap.
      # NUNCA reutilizar estes valores em produção.
      DATABASE_URL: postgresql://zuno_ci:zuno_ci_password@localhost:5432/zuno_ci_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ALLOWED_ORIGINS: http://localhost:3000
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint (strict — zero warnings allowed)
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0

      - name: Run unit tests with coverage
        run: npm run test:cov

      - name: Build
        run: npm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7