name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs antigos do mesmo PR/branch quando há push novo —
# evita filas e desperdicio de minutos quando ha varios commits seguidos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zuno_ci
          POSTGRES_PASSWORD: zuno_ci_password
          POSTGRES_DB: zuno_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zuno_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Variaveis que o backend exige no arranque via getOrThrow.
      # Valores ficticios — servem so para o CI conseguir bootstrap.
      # NUNCA reutilizar estes valores em producao.
      DATABASE_URL: postgresql://zuno_ci:zuno_ci_password@localhost:5432/zuno_db_test?schema=public
      DATABASE_URL_TEST: postgresql://zuno_ci:zuno_ci_password@localhost:5432/zuno_db_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ALLOWED_ORIGINS: http://localhost:3000
      NODE_ENV: test
      # Cloudinary nao e chamado nos E2E (fluxo de fotos nao testado).
      # Estes valores apenas satisfazem o getOrThrow do CloudinaryProvider
      # no bootstrap do AppModule.
      CLOUDINARY_CLOUD_NAME: ci-dummy
      CLOUDINARY_API_KEY: ci-dummy-key
      CLOUDINARY_API_SECRET: ci-dummy-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint (strict — zero warnings allowed)
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0

      - name: Run unit tests with coverage
        run: npm run test:cov

      - name: Build
        run: npm run build

      - name: Apply migrations to test DB
        run: npx prisma migrate deploy

      # O build pode passar e o artefacto nao arrancar (ponto de entrada no
      # sitio errado, modulo em falta). Este passo corre o dist/ tal como o
      # start:prod e espera pela resposta do /ready, que ja toca na base.
      - name: Smoke test compiled app
        run: |
          node dist/main &
          APP_PID=$!
          trap 'kill "$APP_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fs http://127.0.0.1:3000/ready > /dev/null; then
              echo "dist/main respondeu em /ready ao fim de ${attempt} s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::dist/main nao respondeu em /ready ao fim de 30 s"
          exit 1

      - name: Create .env for E2E setup helper
        run: |
          echo "DATABASE_URL=${DATABASE_URL}" > .env
          echo "DATABASE_URL_TEST=${DATABASE_URL_TEST}" >> .env
          echo "JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}" >> .env
          echo "JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN}" >> .env
          echo "JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}" >> .env
          echo "ALLOWED_ORIGINS=${ALLOWED_ORIGINS}" >> .env

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  docker-image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zuno_ci
          POSTGRES_PASSWORD: zuno_ci_password
          POSTGRES_DB: zuno_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zuno_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://zuno_ci:zuno_ci_password@localhost:5432/zuno_db_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # O compose nao corre aqui, mas um erro nele so se via no servidor.
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          POSTGRES_PASSWORD=ci docker compose config --quiet

      - name: Build migrate image
        run: docker build --target migrate --tag zuno-back-migrate:ci .

      - name: Build app image
        run: docker build --tag zuno-back:ci .

      - name: Apply migrations with the migrate image
        run: docker run --rm --network host --env DATABASE_URL zuno-back-migrate:ci

      # A imagem corre com NODE_ENV=production, que exige um segredo JWT de 64
      # caracteres ou mais, o token do /metrics e o numero para onde os
      # clientes pagam no modo manual. Os segredos sao gerados na hora e nao
      # servem para mais nada.
      - name: Start app image
        run: |
          docker run --detach --name zuno-back --network host \
            --env DATABASE_URL \
            --env JWT_ACCESS_SECRET="$(openssl rand -hex 64)" \
            --env METRICS_TOKEN="$(openssl rand -hex 32)" \
            --env PAYMENTS_MANUAL_RECEIVER_NUMBER=840000000 \
            --env CLOUDINARY_CLOUD_NAME=ci-dummy \
            --env CLOUDINARY_API_KEY=ci-dummy-key \
            --env CLOUDINARY_API_SECRET=ci-dummy-secret \
            zuno-back:ci

      # Espera pelo HEALTHCHECK da propria imagem, para o caminho que ele
      # chama tambem ficar testado.
      - name: Wait for the container healthcheck
        run: |
          for attempt in $(seq 1 45); do
            status="$(docker inspect --format '{{.State.Health.Status}}' zuno-back)"
            if [ "$status" = "healthy" ]; then
              curl -fsS http://127.0.0.1:3000/ready
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' zuno-back)" != "true" ]; then
              break
            fi
            sleep 2
          done
          echo "::error::o contentor nao ficou healthy (estado: ${status})"
          docker logs zuno-back
          exit 1
